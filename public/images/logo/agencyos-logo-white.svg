<svg width="280" height="80" viewBox="0 0 280 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');</style>
    <linearGradient id="brand-bg" x1="0" y1="0" x2="280" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <mask id="ao-mask-brand">
      <rect width="280" height="80" fill="white"/>
      <circle cx="53" cy="46" r="6.9" fill="black"/>
    </mask>
  </defs>

  <!-- A mark -->
  <g mask="url(#ao-mask-brand)" stroke="white" stroke-width="5.2" stroke-linecap="round">
    <line x1="40" y1="10" x2="21" y2="69"/>
    <line x1="40" y1="10" x2="59" y2="69"/>
  </g>

  <!-- O ring -->
  <circle cx="53" cy="46" r="9" stroke="white" stroke-width="5.2" fill="none"/>

  <!-- Wordmark -->
  <text x="84" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.84" fill="white">Agency<tspan fill="rgba(255,255,255,0.7)" font-weight="700">OS</tspan></text>
</svg>
